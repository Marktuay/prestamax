services:
  db:
    image: mysql:8.0
    container_name: prestamax-mysql
    restart: unless-stopped
    environment:
      # SECURITY: Use environment variables instead of hardcoded passwords
      # Create a .env file in the root directory with these values:
      # MYSQL_ROOT_PASSWORD=<your-strong-password>
      # MYSQL_DATABASE=prestamax
      # MYSQL_USER=prestamaxuser
      # MYSQL_PASSWORD=<your-strong-password>
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-prestamax}
      MYSQL_USER: ${MYSQL_USER:-prestamaxuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./prestamax-backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
